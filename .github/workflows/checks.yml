# The quick checks (the unit tests, the start-up scripts, the AI apps' bridge)
# on Linux with SuperCollider 3.14.1, on every push and pull request: the
# installer run as a user runs it, on Debian testing (tools/ci-linux.sh), with
# VSTPlugin and without, as megalooper runs either way.
#
# The full checks (the panes, drawn off screen, and the offline renders, some
# of them on the kits' samples) run on a Mac: tools/run-checks.sh, which
# tools/release.sh runs before every release and refuses to release over.
name: Checks

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quick-linux:
    name: Quick checks, Linux, ${{ matrix.vstplugin }}
    runs-on: ubuntu-latest
    container: debian:testing
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        vstplugin: [with VSTPlugin, without VSTPlugin]
    steps:
      - uses: actions/checkout@v4
      - name: Install as a user would, and run the quick checks
        run: tools/ci-linux.sh ${{ matrix.vstplugin == 'without VSTPlugin' && '--no-vstplugin' || '' }}
      - name: Keep the checks' logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: checks-logs-${{ strategy.job-index }}
          path: /tmp/megalooper-checks.*/
          if-no-files-found: ignore
